<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <title>NewsFlow Admin</title>
<script>
window.onerror = function(msg, url, line, col, err) {
  var e = document.getElementById('root');
  if (e) e.innerHTML = '<div style="color:red;padding:20px;font-family:monospace"><h3>ERROR</h3><pre>' +
    (err && err.stack ? err.stack.replace(/</g,'&lt;') : String(msg).replace(/</g,'&lt;')) +
    '</pre></div>';
  return false;
};
window.addEventListener('unhandledrejection', function(e) {
  var err = e.reason;
  var el = document.getElementById('root');
  if (el) el.innerHTML = '<div style="color:red;padding:20px;font-family:monospace"><h3>PROMISE ERROR</h3><pre>' +
    (err && err.stack ? err.stack.replace(/</g,'&lt;') : String(err).replace(/</g,'&lt;')) +
    '</pre></div>';
});
</script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
