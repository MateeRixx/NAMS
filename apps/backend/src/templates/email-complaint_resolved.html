<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  body{margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f4f4f6;color:#333}
  .container{max-width:560px;margin:40px auto;background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.08)}
  .header{background:#059669;padding:24px 32px}
  .header h1{margin:0;color:#fff;font-size:20px;font-weight:600}
  .body{padding:32px}
  .footer{background:#f9fafb;padding:16px 32px;font-size:12px;color:#6b7280;text-align:center}
  .btn{display:inline-block;padding:10px 24px;background:#059669;color:#fff;text-decoration:none;border-radius:6px;font-size:14px;font-weight:500;margin-top:16px}
</style>
</head>
<body>
<div class="container">
  <div class="header"><h1>Complaint Resolved</h1></div>
  <div class="body">
    <p>Hi {{customerName}},</p>
    <p>Your complaint has been resolved.</p>
    <p><strong>Issue:</strong> {{complaintType}}</p>
    <p>We hope this resolves your concern. If you have any further questions, please reach out.</p>
    <a href="{{portalUrl}}/complaints" class="btn">View Complaints</a>
  </div>
  <div class="footer"><p>NewsFlow — Newspaper Distribution Platform</p></div>
</div>
</body>
</html>
