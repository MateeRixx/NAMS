<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  body{margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f4f4f6;color:#333}
  .container{max-width:560px;margin:40px auto;background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.08)}
  .header{background:#1a56db;padding:24px 32px}
  .header h1{margin:0;color:#fff;font-size:20px;font-weight:600}
  .body{padding:32px}
  .amount{font-size:28px;font-weight:700;color:#1a56db;margin:16px 0}
  .detail{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #f0f0f0;font-size:14px}
  .footer{background:#f9fafb;padding:16px 32px;font-size:12px;color:#6b7280;text-align:center}
  .btn{display:inline-block;padding:10px 24px;background:#1a56db;color:#fff;text-decoration:none;border-radius:6px;font-size:14px;font-weight:500;margin-top:16px}
</style>
</head>
<body>
<div class="container">
  <div class="header"><h1>Invoice Generated</h1></div>
  <div class="body">
    <p>Hi {{customerName}},</p>
    <p>A new invoice has been generated for your subscription.</p>
    <div class="detail"><span>Invoice Number</span><span>{{invoiceNumber}}</span></div>
    <div class="detail"><span>Billing Period</span><span>{{billingPeriod}}</span></div>
    <div class="detail"><span>Total Amount</span></div>
    <div class="amount">₹ {{totalAmount}}</div>
    <p style="font-size:13px;color:#6b7280">Due Date: {{dueDate}}</p>
    <a href="{{portalUrl}}/invoices/{{invoiceId}}" class="btn">View Invoice</a>
  </div>
  <div class="footer"><p>NewsFlow — Newspaper Distribution Platform</p></div>
</div>
</body>
</html>
