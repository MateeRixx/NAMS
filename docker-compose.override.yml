version: '3.9'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: newsflow-backend
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/newsflow?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: dev-jwt-secret-that-is-at-least-32-characters-long
      PAYMENT_PROVIDER: razorpay
      PAYMENT_KEY_ID: ***REMOVED***
      PAYMENT_KEY_SECRET: ***REMOVED***
      EMAIL_FROM: onboarding@resend.dev
      EMAIL_PROVIDER: resend
      RESEND_API_KEY: ***REMOVED***
      EMAIL_API_KEY: ***REMOVED***
    volumes:
      - ./apps/backend/src:/app/apps/backend/src
      - ./packages/shared/src:/app/packages/shared/src
      - ./packages/database/src:/app/packages/database/src
      - ./packages/database/prisma:/app/packages/database/prisma
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: sh -c "pnpm --filter=database db:push && pnpm --filter=database db:seed && pnpm dev"
